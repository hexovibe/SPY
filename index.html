<head>

        <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('public/uploads/upload_1.jpg') center/cover no-repeat;
            opacity: 0.25;
            z-index: 0;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(10,10,10,0.8) 0%, rgba(20,0,0,0.9) 50%, rgba(10,10,10,0.95) 100%);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .lang-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            max-height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            color: #ff1a1a;
            text-shadow: 0 0 20px rgba(255,26,26,0.5), 0 0 40px rgba(255,26,26,0.3);
            margin-bottom: 10px;
            letter-spacing: 4px;
        }

        .subtitle {
            font-size: 1rem;
            color: #888;
            margin-bottom: 50px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .lang-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: #ccc;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .lang-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 300px;
        }

        .lang-btn {
            background: linear-gradient(135deg, rgba(255,26,26,0.15) 0%, rgba(255,26,26,0.05) 100%);
            border: 2px solid rgba(255,26,26,0.4);
            color: #fff;
            padding: 18px 30px;
            font-size: 1.1rem;
            font-family: 'Roboto', sans-serif;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }

        .lang-btn:hover {
            background: linear-gradient(135deg, rgba(255,26,26,0.35) 0%, rgba(255,26,26,0.15) 100%);
            border-color: #ff1a1a;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255,26,26,0.3);
        }

        .lang-btn:active {
            transform: translateY(0);
        }

        .setup-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .setup-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: #ff1a1a;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .player-count-label {
            font-size: 1rem;
            color: #aaa;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .player-input-container {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 50px;
        }

        .player-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid rgba(255,26,26,0.5);
            background: rgba(255,26,26,0.1);
            color: #ff1a1a;
            font-size: 1.5rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .player-btn:hover {
            background: rgba(255,26,26,0.3);
            transform: scale(1.1);
        }

        .player-count {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            color: #fff;
            min-width: 80px;
            text-align: center;
        }

        .start-btn {
            background: linear-gradient(135deg, #ff1a1a 0%, #cc0000 100%);
            border: none;
            color: #fff;
            padding: 20px 60px;
            font-size: 1.2rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 10px 40px rgba(255,26,26,0.4);
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 50px rgba(255,26,26,0.6);
        }

        .start-btn:active {
            transform: translateY(0);
        }

        .back-btn {
            margin-top: 30px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: #888;
            padding: 12px 30px;
            font-size: 0.9rem;
            font-family: 'Roboto', sans-serif;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .back-btn:hover {
            border-color: rgba(255,255,255,0.4);
            color: #ccc;
        }

        .game-screen {
            display: none;
            flex-direction: column;
            min-height: 100vh;
            padding-top: 30px;
            overflow-y: auto;
        }

        .game-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            color: #ff1a1a;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .game-info {
            font-size: 0.9rem;
            color: #888;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .card {
            aspect-ratio: 1;
            background: linear-gradient(135deg, rgba(255,26,26,0.1) 0%, rgba(20,20,20,0.9) 100%);
            border: 2px solid rgba(255,26,26,0.3);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            border-color: rgba(255,26,26,0.6);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255,26,26,0.2);
        }

        .card.revealed {
            background: linear-gradient(135deg, rgba(255,26,26,0.3) 0%, rgba(40,0,0,0.95) 100%);
            border-color: #ff1a1a;
        }

        .card.used {
            opacity: 0.3;
            pointer-events: none;
            border-color: rgba(255,255,255,0.1);
        }

        .card-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            color: rgba(255,26,26,0.6);
        }

        .card-word {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            text-align: center;
            padding: 10px;
            text-shadow: 0 0 10px rgba(255,26,26,0.5);
        }

        .card-word.spy {
            color: #ff1a1a;
            font-size: 1rem;
        }

        .spy-icon {
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        .timer-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 4px;
            background: #ff1a1a;
            width: 100%;
            transform-origin: left;
            animation: timerShrink 1s linear forwards;
        }

        @keyframes timerShrink {
            from { transform: scaleX(1); }
            to { transform: scaleX(0); }
        }

        .reset-btn {
            background: linear-gradient(135deg, rgba(255,26,26,0.2) 0%, rgba(255,26,26,0.1) 100%);
            border: 2px solid rgba(255,26,26,0.4);
            color: #fff;
            padding: 16px 40px;
            font-size: 1rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 auto;
            display: block;
        }

        .reset-btn:hover {
            background: linear-gradient(135deg, rgba(255,26,26,0.4) 0%, rgba(255,26,26,0.2) 100%);
            border-color: #ff1a1a;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255,26,26,0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255,26,26,0.3); }
            50% { box-shadow: 0 0 40px rgba(255,26,26,0.6); }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        .watermark {
            position: fixed;
            bottom: 10px;
            left: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            color: rgba(255, 26, 26, 0.3);
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 1000;
            pointer-events: none;
            user-select: none;
        }

        @media (max-width: 400px) {
            .logo { font-size: 2.5rem; }
            .cards-grid { gap: 10px; }
            .card-word { font-size: 1rem; }
        }
    </style>

    <script>
        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => {
                        console.log('Service Worker registered successfully:', registration);
                    })
                    .catch((error) => {
                        console.log('Service Worker registration failed:', error);
                    });
            });
        }

        // PWA Install Prompt
        let deferredPrompt;
        const installButton = document.createElement('button');
        installButton.textContent = '📱 Установить приложение';
        installButton.style.cssText = `
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #ff1a1a 0%, #cc0000 100%);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 12px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(255,26,26,0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: none;
        `;
        
        installButton.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`User response to the install prompt: ${outcome}`);
                deferredPrompt = null;
                installButton.style.display = 'none';
            }
        });
        
        document.body.appendChild(installButton);

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installButton.style.display = 'block';
        });

        window.addEventListener('appinstalled', () => {
            console.log('PWA was installed');
            installButton.style.display = 'none';
        });

        // Check if app is running in standalone mode
        function isStandalone() {
            return window.matchMedia('(display-mode: standalone)').matches || 
                   window.navigator.standalone === true;
        }

        if (isStandalone()) {
            console.log('App is running in standalone mode');
            document.body.classList.add('standalone-mode');
        }

                subtitle: "Offline game",
                langTitle: "Select language",
                setupTitle: "Game setup",
                playerLabel: "Number of players",
                startBtn: "Start game",

                spy: "SPY",

            }

        let currentLang = 'ru';
        let playerCount = 4;
        let gameWord = '';
        let spyIndex = -1;
        let revealedCards = new Set();

        function selectLanguage(lang) {
            currentLang = lang;
            updateTranslations();
            document.getElementById('langScreen').style.display = 'none';
            document.getElementById('setupScreen').style.display = 'flex';
            document.getElementById('setupScreen').classList.add('fade-in');
        }

        function updateTranslations() {
            const t = translations[currentLang];
            document.getElementById('setupTitle').textContent = t.setupTitle;
            document.getElementById('playerLabel').textContent = t.playerLabel;
            document.getElementById('startBtn').textContent = t.startBtn;
            document.getElementById('backBtn').textContent = t.backBtn;
            document.getElementById('gameTitle').textContent = t.gameTitle;
            document.getElementById('gameInfo').textContent = t.gameInfo;
            document.getElementById('resetBtn').textContent = t.resetBtn;
        }

        function changePlayers(delta) {
            playerCount += delta;
            if (playerCount < 3) playerCount = 3;
            if (playerCount > 12) playerCount = 12;
            document.getElementById('playerCount').textContent = playerCount;
        }

        function goBack() {
            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('langScreen').style.display = 'flex';
        }

        function startGame() {
            const langWords = words[currentLang];
            gameWord = langWords[Math.floor(Math.random() * langWords.length)];
            spyIndex = Math.floor(Math.random() * playerCount);
            revealedCards.clear();

            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            for (let i = 0; i < playerCount; i++) {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = i;
                card.innerHTML = '<div class="card-number">' + (i + 1) + '</div>';
                card.onclick = function() { revealCard(i, card); };
                grid.appendChild(card);
            }

            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
            document.getElementById('gameScreen').classList.add('fade-in');
        }

        function revealCard(index, cardElement) {
            if (revealedCards.has(index)) return;
            revealedCards.add(index);
            const t = translations[currentLang];

            if (index === spyIndex) {
                cardElement.innerHTML = '<div style="text-align:center"><div class="spy-icon">&#128373;</div><div class="card-word spy">' + t.spy + '</div></div><div class="timer-bar"></div>';
            } else {
                cardElement.innerHTML = '<div class="card-word">' + gameWord + '</div><div class="timer-bar"></div>';
            }

            cardElement.classList.add('revealed');

            setTimeout(function() {
                cardElement.innerHTML = '<div class="card-number">' + (index + 1) + '</div>';
                cardElement.classList.remove('revealed');
                cardElement.classList.add('used');
            }, 1000);
        }

        function resetGame() {
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('setupScreen').style.display = 'flex';
            document.getElementById('setupScreen').classList.add('fade-in');
        }
    </script>
