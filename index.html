
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Шпион Premium</title>

<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Шпион">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#050505;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
color:white;
}

.bg{
position:absolute;
inset:0;
background:
radial-gradient(circle at top,#ff1a1a33,transparent 45%),
radial-gradient(circle at bottom,#77000044,transparent 45%),
#050505;
filter:blur(4px);
}

.card{
position:relative;
z-index:2;
width:92%;
max-width:420px;
padding:40px 24px;
border-radius:32px;
background:rgba(255,255,255,0.06);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,0.08);
box-shadow:0 10px 60px rgba(255,0,0,0.22);
text-align:center;
animation:fade 1s ease;
}

.logo{
width:120px;
height:120px;
border-radius:50%;
margin:0 auto 24px;
background:url('icon-512.png') center/cover no-repeat;
box-shadow:0 0 40px rgba(255,0,0,0.35);
}

h1{
font-size:42px;
margin-bottom:12px;
letter-spacing:2px;
}

p{
opacity:.75;
margin-bottom:28px;
}

.btn{
display:inline-block;
padding:18px 34px;
border-radius:999px;
background:linear-gradient(135deg,#ff1a1a,#8b0000);
color:white;
font-weight:bold;
text-decoration:none;
font-size:18px;
transition:.3s;
box-shadow:0 8px 30px rgba(255,0,0,0.4);
}

.btn:active{
transform:scale(.96);
}

.install-tip{
margin-top:22px;
font-size:14px;
opacity:.6;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px) scale(.96);
}
to{
opacity:1;
transform:translateY(0) scale(1);
}
}
</style>
</head>
<body>

<div class="bg"></div>

<div class="card">
<div class="logo"></div>
<h1>ШПИОН</h1>
<p>Premium PWA приложение с идеальной установкой на главный экран</p>
<a class="btn" href="#">PLAY</a>
<div class="install-tip">Добавь на главный экран для fullscreen режима</div>
</div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js');
  });
}
</script>

</body>
</html>
