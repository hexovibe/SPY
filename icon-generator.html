<!DOCTYPE html>
<html>
<head>
    <title>Generate PWA Icons</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f0f0f0; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        button { background: #ff1a1a; color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; font-size: 16px; margin: 10px; }
        canvas { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎮 Generate PWA Icons for SPY Game</h2>
        <p>Click the button to generate all required PWA icons:</p>
        <button onclick="generateIcons()">🚀 Generate All Icons</button>
        <canvas id="canvas"></canvas>
        <div id="status"></div>
    </div>

    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        
        function createIconSVG(size) {
            const svg = `
            <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#ff1a1a;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#cc0000;stop-opacity:1" />
                    </linearGradient>
                    <filter id="shadow">
                        <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
                    </filter>
                </defs>
                <rect width="${size}" height="${size}" rx="${size * 0.2}" fill="url(#bg)"/>
                <text x="${size/2}" y="${size/2 + 10}" 
                      font-family="Arial Black, sans-serif" 
                      font-size="${size * 0.35}" 
                      font-weight="900" 
                      fill="white" 
                      text-anchor="middle"
                      filter="url(#shadow)">Ш</text>
                <text x="${size/2}" y="${size/2 + 30}" 
                      font-family="Arial Black, sans-serif" 
                      font-size="${size * 0.2}" 
                      font-weight="900" 
                      fill="white" 
                      text-anchor="middle"
                      filter="url(#shadow)">ПИОН</text>
            </svg>`;
            return svg;
        }
        
        function downloadIcon(size) {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            
            canvas.width = size;
            canvas.height = size;
            
            img.onload = function() {
                ctx.drawImage(img, 0, 0);
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `icon-${size}x${size}.png`;
                    a.click();
                    URL.revokeObjectURL(url);
                });
            };
            
            const svgString = createIconSVG(size);
            const svgBlob = new Blob([svgString], {type: 'image/svg+xml'});
            const url = URL.createObjectURL(svgBlob);
            img.src = url;
        }
        
        function generateIcons() {
            const status = document.getElementById('status');
            status.innerHTML = '<p>Generating icons... Please wait.</p>';
            
            sizes.forEach((size, index) => {
                setTimeout(() => {
                    downloadIcon(size);
                    status.innerHTML += `<p>✅ Generated icon-${size}x${size}.png</p>`;
                }, index * 500);
            });
        }
    </script>
</body>
</html>
